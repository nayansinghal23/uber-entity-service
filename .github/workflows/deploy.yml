name: Deploy UberEntityService to EC2

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Build the JAR
      - name: Build UberEntityService
        run: |
          chmod +x gradlew
          ./gradlew clean build

      # 4. Locate the generated JAR
      - name: Locate JAR
        id: jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name 'UberEntityService-*.jar' \
            ! -name '*-plain.jar' \
            | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(find build/libs \
              -maxdepth 1 \
              -type f \
              -name 'UberEntityService-*.jar' \
              | head -n 1)
          fi

          if [ -z "$JAR_PATH" ]; then
            echo "UberEntityService JAR not found!"
            exit 1
          fi

          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"
          echo "Generated JAR: $JAR_PATH"

      # 5. Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Upload JAR to EC2
      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            "$JAR_PATH" \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/"

      # 7. Verify uploaded JAR
      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          JAR_NAME=$(basename "$JAR_PATH")

          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "ls -lh /home/ubuntu/$JAR_NAME"