spring.application.name=UberEntityService
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uber_db_local}
spring.datasource.username=${DB_USERNAME:uber_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
server.port=${PORT:7476}
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:mysql://localhost:3306/uber_db_local}
spring.flyway.user=${DB_USERNAME:uber_app}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
logging.level.org.springframework.data=INFO